name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: linux-debug
          - os: macos-latest
            preset: macos-debug
          - os: windows-latest
            preset: windows-debug

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up C++ tools
        uses: aminya/setup-cpp@v1
        with:
          compiler: llvm
          vcvarsall: true
          cmake: true
          ninja: true
          clangformat: true
          clangtidy: true

      - name: Verify formatting
        shell: bash
        run: >
          clang-format --dry-run --Werror
          $(git ls-files '*.cpp' '*.hpp')

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Verify static analysis
        shell: bash
        run: >
          clang-tidy --warnings-as-errors='*'
          -p build/${{ matrix.preset }}
          $(git ls-files '*.cpp')
