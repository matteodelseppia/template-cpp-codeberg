name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: linux-debug
          - os: macos-latest
            preset: macos-debug
          - os: windows-latest
            preset: windows-debug

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up C++ tools
        uses: aminya/setup-cpp@v1
        with:
          compiler: llvm
          vcvarsall: true
          cmake: true
          ninja: true
          clangformat: true
          clangtidy: true

      - name: Verify formatting
        shell: bash
        run: |
          git ls-files -z -- '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx' |
            xargs -0 clang-format --dry-run --Werror

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Verify static analysis
        shell: bash
        run: |
          git ls-files -z -- '*.c' '*.cc' '*.cpp' '*.cxx' |
            xargs -0 clang-tidy --warnings-as-errors='*' \
              -p build/${{ matrix.preset }}

  report-codeberg-status:
    name: Report status to Codeberg
    needs: build-and-test
    # PR commits may not exist in the Codeberg mirror and secrets are unavailable
    # to forked PRs. Report only mirrored push commits, when configured.
    if: ${{ always() && github.event_name == 'push' && vars.CODEBERG_REPOSITORY != '' }}
    runs-on: ubuntu-latest
    env:
      CODEBERG_REPOSITORY: ${{ vars.CODEBERG_REPOSITORY }}
      CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
      CI_RESULT: ${{ needs.build-and-test.result }}
    steps:
      - name: Publish commit status
        shell: bash
        run: |
          case "$CI_RESULT" in
            success) state=success ;;
            failure) state=failure ;;
            cancelled) state=error ;;
            *) state=error ;;
          esac

          curl --fail-with-body --request POST \
            "https://codeberg.org/api/v1/repos/${CODEBERG_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --header "Authorization: token ${CODEBERG_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "$(jq -n \
              --arg state "$state" \
              --arg context "github-actions/ci" \
              --arg description "GitHub Actions CI: $state" \
              --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              '{state: $state, context: $context, description: $description, target_url: $target_url}')"
